name: Lint

# Ruff over the Python scripts and notebooks; rules in ruff.toml.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # The notebooks live in Git LFS; fetch only those, not the other assets.
      - name: Fetch notebooks from LFS
        run: git lfs pull --include="docs/**/*.ipynb"

      - uses: astral-sh/ruff-action@v4.1.0
