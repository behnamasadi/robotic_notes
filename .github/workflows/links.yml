name: Links

# Every relative link in the Markdown docs must point at a file that exists.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lychee:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Check relative links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --exclude-path vcpkg --exclude-path third_party './**/*.md'
          fail: true
