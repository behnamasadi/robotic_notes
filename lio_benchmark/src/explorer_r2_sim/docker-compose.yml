name: explorer_r2_sim

# One service: `sim` runs Gazebo + ros_gz_bridge + RViz inside the container.
# The host's ~/ros2_ws is bind-mounted into the container at /ws — so source
# edits show up live, the OpenVINS + FAST_LIO submodules pinned in the host
# repo are what actually gets built, and build/install/log live on the host
# (gitignored). The entrypoint runs colcon build on first start, then reuses
# the cache.
#
# Usage:
#   docker compose up                   # gz + bridge + RViz + joy (mode 1)
#   docker compose exec sim ros2 launch explorer_r2_sim vio.launch.py  # + mode 2
#   docker compose exec sim ros2 launch explorer_r2_sim lio.launch.py  # + mode 3
#   docker compose run --rm sim bash    # interactive shell
#   BUILD=force docker compose up       # rebuild from scratch
#   WORLD=cave docker compose up        # different world (default: tunnel)
#   WORLD=rubicon docker compose up     # any preset, local SDF path, or Fuel URL
#
# After bring-up, drive from any other ROS 2 terminal sharing ROS_DOMAIN_ID:
#   ros2 run teleop_twist_keyboard teleop_twist_keyboard

services:
  sim:
    build:
      context: .
      dockerfile: docker/sim.Dockerfile
      args:
        ROS_DISTRO: ${ROS_DISTRO:-jazzy}
        GZ_PKG:     ${GZ_PKG:-gz-harmonic}
    image: explorer_r2_sim/sim:${ROS_DISTRO:-jazzy}
    # Override the Dockerfile CMD so we can plumb $WORLD through to the
    # cave.launch.py world:= arg without editing anything in-tree. The
    # default (tunnel) matches the launch file's own default; pass any
    # preset (tunnel | cave | rubicon | tugbot_depot | singapore_river),
    # any local SDF path, or any Fuel URL.
    command:
      - ros2
      - launch
      - explorer_r2_sim
      - cave.launch.py
      - world:=${WORLD:-tunnel}
      # rqt_robot_steering window — sliders for linear + angular vel
      # on /cmd_vel, handy when no joystick is connected. Off by
      # default in cave.launch.py; on here so `docker compose up`
      # always opens the GUI. Set RQT_STEERING=false in the env to
      # suppress (or just close the window — won't affect anything
      # else).
      - rqt_steering:=${RQT_STEERING:-true}
    network_mode: host
    ipc: host
    privileged: true
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-42}
      DISPLAY: ${DISPLAY}
      QT_X11_NO_MITSHM: 1
      XDG_RUNTIME_DIR: /tmp/runtime-root
      NVIDIA_DRIVER_CAPABILITIES: all
      NVIDIA_VISIBLE_DEVICES: all
      # Wire gz-rendering's Ogre2 to the NVIDIA EGL stack instead of Mesa's
      # llvmpipe software rasterizer. The Dockerfile installs libglvnd0 +
      # mesa-utils; __EGL_VENDOR_LIBRARY_FILENAMES tells GLVND which vendor
      # ICD to load for EGL. We deliberately do NOT set
      # __GLX_VENDOR_LIBRARY_NAME=nvidia — that forces gz-sim onto NVIDIA's
      # GLX extension, which requires a working X server with the NVIDIA
      # display driver. Inside this container DISPLAY points at the host's
      # X socket but the X server has no NVIDIA GLX module, so gz-sim
      # crashes with "X Error of failed request: BadValue, Major opcode 156
      # (NV-GLX)". OGRE_RTT_MODE=FBO + GZ_HEADLESS_RENDERING=1 force
      # offscreen render targets through EGL, which is exactly the path
      # NVIDIA's container runtime supports without an X server.
      __EGL_VENDOR_LIBRARY_FILENAMES: /usr/share/glvnd/egl_vendor.d/10_nvidia.json
      OGRE_RTT_MODE: FBO
      GZ_HEADLESS_RENDERING: "1"
      # Use Cyclone DDS — it's significantly more reliable for the
      # sim's mix of high-rate IMU + LiDAR + multiple estimators all
      # publishing on /tf simultaneously than FastDDS in our testing.
      # (FastDDS dropped publishes from FAST-LIO and KISS-ICP under
      # load on the same hardware.) Cyclone also defaults to
      # shared-memory loopback for same-host comms, near-zero-copy
      # for image-sized payloads (see docs/PERFORMANCE.md).
      # Trade-off: the LIO-SAM sibling container uses FastDDS (only
      # RMW shipped in upstream's image). Cyclone↔FastDDS interop
      # works at the wire level but emits "type hash" warnings; the
      # known-bad case is `ros2 topic info -v`. /tf and basic topics
      # cross fine.
      RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
      # Entrypoint build behaviour: auto | force | skip
      BUILD: ${BUILD:-auto}
    volumes:
      # Bind the whole workspace into the container. Compose file lives at
      # ros2_ws/src/explorer_r2_sim/, so ../.. is the workspace root.
      - ../..:/ws:rw
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      # Persist Fuel asset cache so cave tiles + r2 mesh only download once.
      # Volume names retained from the prior package name so the existing
      # cache (cave + tunnel tiles + EXPLORER_R2 mesh) is reused.
      - fuel:/root/.gz/fuel
      - fuel_ign:/root/.ignition/fuel
      # Joystick: bind /dev/input so joy_node can open jsX / eventX.
      - /dev/input:/dev/input
      # Real-world VIO datasets (EuRoC, TUM-VIO etc). Read-only mount so
      # bag play can pick up sequences from ~/datasets/ on the host.
      - ~/datasets:/datasets:ro
      # Public LIO/SLAM benchmark datasets (Newer College, KITTI,
      # HILTI, MulRan, …) live under robotic_notes/data/slam/ at the
      # repo root. Read-only bind mount so bag.launch.py can play
      # them inside the container without copying.
      - ../../../data:/data:ro
    devices:
      - /dev/dri:/dev/dri
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # === Bag replay (real-world LiDAR-IMU datasets) ============================
  # Plays a converted rosbag2 (Newer College, KITTI, HILTI, …) through the
  # four estimators instead of Gazebo. Same image as `sim`; just runs
  # bag.launch.py in place of cave.launch.py.
  #
  # MUTUALLY EXCLUSIVE with `sim` — both publish /lidar/points + /imu, so
  # running both at once would mix Gazebo data with the bag stream. Always
  # `docker compose down` before bringing up `bag`.
  #
  # Behind the `bag` compose profile so `docker compose up` (default) brings
  # up the Gazebo flow; opt-in to the bag flow explicitly:
  #
  #   docker compose down                                  # stop sim if running
  #   docker compose --profile bag up bag lio_sam         # bag + LIO-SAM
  #
  # Override the bag with env vars:
  #   BAG_PATH=/data/...other-bag DATASET=newer_college \
  #     docker compose --profile bag up bag lio_sam
  bag:
    profiles: [bag]
    image: explorer_r2_sim/sim:${ROS_DISTRO:-jazzy}
    container_name: bag
    command:
      - ros2
      - launch
      - explorer_r2_sim
      - bag.launch.py
      - bag_path:=${BAG_PATH:-/data/slam/collection 1 - newer college/ros2/stairs}
      - dataset:=${DATASET:-newer_college}
      - rate:=${RATE:-1.0}
      - loop:=${LOOP:-false}
    network_mode: host
    ipc: host
    privileged: true
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-42}
      DISPLAY: ${DISPLAY}
      QT_X11_NO_MITSHM: 1
      XDG_RUNTIME_DIR: /tmp/runtime-root
      NVIDIA_DRIVER_CAPABILITIES: all
      NVIDIA_VISIBLE_DEVICES: all
      __EGL_VENDOR_LIBRARY_FILENAMES: /usr/share/glvnd/egl_vendor.d/10_nvidia.json
      RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
      # `bag` never builds anything — the sim image's install/ is already
      # populated by a prior `docker compose up sim --build`. Skip the
      # colcon check.
      BUILD: skip
    volumes:
      - ../..:/ws:rw
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ../../../data:/data:ro
    devices:
      - /dev/dri:/dev/dri
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # LIO-SAM — runs alongside `sim` by default. Built on ROS Jazzy
  # (matching `sim`) so DDS delivers messages cross-container without
  # the type-hash issues that block Humble↔Jazzy. GTSAM 4.1 + unstable
  # built from source because (a) LIO-SAM uses
  # `gtsam_unstable::IncrementalFixedLagSmoother`, (b) Noble's apt
  # ships GTSAM 4.2 only (no libgtsam-unstable-dev), and (c) the
  # borglab PPA targets Jammy. See docker/lio_sam.Dockerfile.
  #
  # To skip LIO-SAM (e.g., if you only care about pure odometry and
  # want a faster `docker compose up`): `docker compose up sim`. The
  # explicit service name disables auto-bringup of `lio_sam`.
  lio_sam:
    build:
      context: .
      dockerfile: docker/lio_sam.Dockerfile
    image: lio_sam_jazzy:latest
    container_name: lio_sam
    network_mode: host
    ipc: host
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-42}
      RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
    volumes:
      # Replace LIO-SAM's stock params.yaml with our sim-specific
      # override (16-beam Ouster topology, namespaced lio_sam/* frames,
      # LiDAR-1.05m-above-base extrinsic, /lidar/points_lio + /imu
      # topic names, loop closure enabled).
      - ./config/lio_sam.yaml:/root/ros2_ws/install/lio_sam/share/lio_sam/config/params.yaml:ro
      # Use our minimal launch instead of upstream's run.launch.py.
      # Theirs also starts robot_state_publisher with their xacro and a
      # bare-named map→odom static TF — both pollute our TF graph with
      # conflicting frames. Ours only starts the 4 LIO-SAM nodes; the
      # static TFs we need are published from world.launch.py in `sim`
      # and reach this container via DDS.
      - ./launch/lio_sam_container.launch.py:/lio_sam_container.launch.py:ro
    command:
      - bash
      - -lc
      - >-
        source /opt/ros/jazzy/setup.bash &&
        source /root/ros2_ws/install/setup.bash &&
        ros2 launch /lio_sam_container.launch.py
    # No depends_on — lio_sam is independent of which "frontend"
    # publishes /lidar/points and /imu. The default `docker compose
    # up` brings both sim + lio_sam by virtue of neither having a
    # profile; the `bag` flow uses `docker compose --profile bag up
    # bag lio_sam` to bring up bag instead of sim.

volumes:
  fuel:
    name: cave_robot_cave_robot_fuel
    external: true
  fuel_ign:
    name: cave_robot_cave_robot_fuel_ign
    external: true
